<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qlik thumbnail generator</title>
<!--
  Qlik thumbnail generator — a single-file tool for making 8:5 thumbnails
  for Qlik Sense apps, sheets and stories (Qlik Cloud and Client-Managed).

  Icons: Lucide (https://lucide.dev), loaded from a CDN at runtime.
  Lucide is released under the ISC License:
    Copyright (c) for portions of Lucide are held by Cole Bemis 2013-2022 as part of Feather (MIT).
    All other copyright (c) for Lucide are held by Lucide Contributors 2022.
    Permission to use, copy, modify, and/or distribute this software for any purpose with or
    without fee is hereby granted, provided that the above copyright notice and this permission
    notice appear in all copies.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F4F6;
    --panel: #FFFFFF;
    --line: #DDE1E6;
    --line-strong: #B9BEC7;
    --text: #454659;
    --muted: #6E7180;
    --green: #009845;
    --green-dark: #00783A;
    --green-tint: #E0F2E9;
    --focus: #10CFC9;
    --radius: 6px;
    --font: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  header {
    padding: 14px 28px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; color: var(--muted); }

  .app {
    display: grid;
    grid-template-columns: 380px minmax(0, 1fr);
    flex: 1;
    min-height: 0;            /* lets the grid children shrink and scroll */
  }
  .controls {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 4px 24px 20px;
    overflow-y: auto;
    min-height: 0;
  }
  .stage {
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    overflow-y: auto;
    min-height: 0;
  }

  fieldset {
    border: 0;
    margin: 0;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  fieldset:last-of-type { border-bottom: 0; }
  legend { font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 8px; }

  .field { display: block; margin-bottom: 8px; }
  .field:last-child { margin-bottom: 0; }
  .field > span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 13px; }
  input[type="text"], input[type="search"], select {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: #fff;
  }
  input[type="text"]:focus, input[type="search"]:focus, select:focus {
    border-color: var(--green);
    outline: none;
    box-shadow: 0 0 0 3px var(--green-tint);
  }
  input[type="range"] { width: 100%; accent-color: var(--green); margin: 6px 0 0; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  /* Layout picker */
  .layouts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .layouts button {
    height: 52px;
    padding: 0;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--muted);
  }
  .layouts button svg { width: 44px; height: 27px; display: block; }
  .layouts button[aria-pressed="true"] {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-tint);
  }

  /* Colors */
  .colors { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  .color-field { display: block; }
  .color-field > span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 13px; }
  .color-box {
    display: flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 8px 0 4px;
    border: 1px solid var(--line-strong); border-radius: var(--radius); background: #fff;
  }
  .color-box input[type="color"] {
    width: 28px; height: 28px; padding: 0; border: 0; background: none; cursor: pointer;
  }
  .color-box input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .color-box input[type="color"]::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 4px; }
  .color-box input[type="color"]::-moz-color-swatch { border: 1px solid var(--line); border-radius: 4px; }
  .color-box output { font-variant-numeric: tabular-nums; font-size: 13px; }
  .swap {
    height: 36px; width: 36px; padding: 0;
    border: 1px solid var(--line-strong); border-radius: var(--radius); background: #fff;
    cursor: pointer; display: grid; place-items: center; color: var(--muted);
  }
  .swap:hover { color: var(--text); border-color: var(--text); }
  .swatches { display: flex; gap: 8px; margin-top: 12px; }
  .swatches button {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.12); cursor: pointer;
    position: relative;
  }
  .swatches button::after {
    content: ""; position: absolute; inset: 9px; border-radius: 50%;
    background: var(--fg);
  }

  /* Icon picker */
  .icon-search { margin-bottom: 8px; }
  .icon-status { color: var(--muted); font-size: 12px; margin: 0 0 8px; min-height: 16px; }
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 4px;
    max-height: 260px;
    overflow-y: auto;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #FAFBFC;
  }
  .icon-grid button {
    aspect-ratio: 1;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--text);
  }
  .icon-grid button svg { width: 20px; height: 20px; }
  .icon-grid button:hover { background: #fff; border-color: var(--line-strong); }
  .icon-grid button[aria-pressed="true"] { background: var(--green-tint); border-color: var(--green); color: var(--green); }
  .icon-grid .notice { grid-column: 1 / -1; padding: 16px 12px; color: var(--muted); }

  /* Preview */
  .preview {
    width: 100%;
    max-width: min(880px, calc((100vh - 290px) * 1.6));
    border: 1px solid var(--line);
    background: #fff;
    padding: 12px;
  }
  .preview canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 8 / 5;
  }
  .output-bar {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .output-bar .field { margin: 0; }
  .output-bar select { width: 150px; }
  .download {
    height: 36px;
    padding: 0 20px;
    border: 0;
    border-radius: var(--radius);
    background: var(--green);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  .download:hover { background: var(--green-dark); }

  footer {
    padding: 10px 28px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    background: var(--panel);
    flex: none;
  }
  footer a { color: inherit; }

  @media (max-width: 900px) {
    .preview { max-width: 100%; }
    body { height: auto; display: block; }
    .app { grid-template-columns: 1fr; }
    .controls { border-right: 0; border-top: 1px solid var(--line); overflow: visible; order: 2; }
    .stage { padding: 20px 16px; overflow: visible; order: 1; }
    header { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>Qlik thumbnail generator</h1>
  <p>Makes 8:5 thumbnails for apps, sheets and stories — the aspect ratio Qlik Sense expects in the media library.</p>
</header>

<main class="app">
  <section class="controls" aria-label="Thumbnail settings">

    <fieldset>
      <legend>Text</legend>
      <label class="field"><span>Title</span>
        <input type="text" id="title" value="Sales Dashboard" maxlength="80" autocomplete="off">
      </label>
      <label class="field"><span>Second line (optional)</span>
        <input type="text" id="subtitle" value="" maxlength="80" placeholder="e.g. Finance, Weekly" autocomplete="off">
      </label>
    </fieldset>

    <fieldset>
      <legend>Layout</legend>
      <div class="layouts" role="group" aria-label="Layout">
        <button type="button" data-layout="left" aria-pressed="true" title="Icon left, text right">
          <svg viewBox="0 0 44 27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1" y="1" width="42" height="25" rx="2"/><rect x="7" y="8" width="11" height="11" rx="1.5"/><path d="M23 11h13M23 16h9"/></svg>
        </button>
        <button type="button" data-layout="top" aria-pressed="false" title="Icon above text">
          <svg viewBox="0 0 44 27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1" y="1" width="42" height="25" rx="2"/><rect x="17.5" y="5" width="9" height="9" rx="1.5"/><path d="M14 19h16"/></svg>
        </button>
        <button type="button" data-layout="icon" aria-pressed="false" title="Icon only">
          <svg viewBox="0 0 44 27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1" y="1" width="42" height="25" rx="2"/><rect x="16" y="7.5" width="12" height="12" rx="1.5"/></svg>
        </button>
        <button type="button" data-layout="text" aria-pressed="false" title="Text only">
          <svg viewBox="0 0 44 27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1" y="1" width="42" height="25" rx="2"/><path d="M12 11h20M16 16h12"/></svg>
        </button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Colors</legend>
      <div class="colors">
        <label class="color-field"><span>Background</span>
          <div class="color-box"><input type="color" id="bg" value="#009845"><output id="bgHex">#009845</output></div>
        </label>
        <label class="color-field"><span>Icon and text</span>
          <div class="color-box"><input type="color" id="fg" value="#FFFFFF"><output id="fgHex">#FFFFFF</output></div>
        </label>
        <button type="button" class="swap" id="swap" title="Swap colors" aria-label="Swap colors">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
        </button>
      </div>
      <div class="swatches" id="swatches" aria-label="Color presets"></div>
    </fieldset>

    <fieldset id="iconSection">
      <legend>Icon</legend>
      <input type="search" id="iconSearch" class="icon-search" placeholder="Search icons" autocomplete="off" aria-label="Search icons">
      <p class="icon-status" id="iconStatus">Loading icon library…</p>
      <div class="icon-grid" id="iconGrid" role="listbox" aria-label="Icons"></div>
      <div class="row" style="margin-top:12px">
        <label class="field"><span>Icon size</span>
          <input type="range" id="iconSize" min="20" max="70" value="42">
        </label>
        <label class="field"><span>Line weight</span>
          <input type="range" id="stroke" min="1" max="3" step="0.25" value="2">
        </label>
      </div>
    </fieldset>

  </section>

  <section class="stage" aria-label="Preview">
    <div class="preview"><canvas id="canvas" width="1280" height="800" aria-label="Thumbnail preview"></canvas></div>
    <div class="output-bar">
      <label class="field"><span>Size (pixels)</span>
        <select id="size">
          <option value="640">640 × 400</option>
          <option value="800">800 × 500</option>
          <option value="1280" selected>1280 × 800</option>
          <option value="1600">1600 × 1000</option>
          <option value="2560">2560 × 1600</option>
        </select>
      </label>
      <label class="field"><span>Format</span>
        <select id="format">
          <option value="png" selected>PNG</option>
          <option value="jpg">JPG</option>
        </select>
      </label>
      <button type="button" class="download" id="download">Download PNG</button>
    </div>
  </section>
</main>

<footer>
  Icons by <a href="https://lucide.dev" target="_blank" rel="noopener">Lucide</a> (ISC license). Text uses Inter. Nothing you type leaves this page.
</footer>

<script>
(function () {
  // ---- Lucide loader with fallback CDN -------------------------------------------------
  var LUCIDE_URLS = [
    'https://cdn.jsdelivr.net/npm/lucide@1.44.0/dist/umd/lucide.min.js',
    'https://unpkg.com/lucide@1.44.0/dist/umd/lucide.min.js'
  ];
  function loadLucide(i) {
    if (i >= LUCIDE_URLS.length) { window.__lucideFailed = true; if (window.__onLucide) window.__onLucide(); return; }
    var s = document.createElement('script');
    s.src = LUCIDE_URLS[i];
    s.onload = function () { if (window.__onLucide) window.__onLucide(); };
    s.onerror = function () { loadLucide(i + 1); };
    document.head.appendChild(s);
  }
  loadLucide(0);
})();
</script>

<script>
(function () {
  'use strict';

  var FONT = 'Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  var MAX_GRID = 300;

  var state = {
    title: 'Sales Dashboard',
    subtitle: '',
    layout: 'left',          // left | top | icon | text
    icon: 'ChartColumn',
    iconSize: 0.42,          // fraction of canvas height
    stroke: 2,
    bg: '#009845',
    fg: '#FFFFFF',
    width: 1280,
    format: 'png'
  };

  var ICONS = null;          // { PascalName: [[tag, attrs], ...] }
  var iconList = [];         // [{ name, label }]

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('canvas');
  var ctx = canvas.getContext('2d');

  // ---- Presets ----------------------------------------------------------------------
  var PRESETS = [
    ['#009845', '#FFFFFF'],
    ['#454659', '#FFFFFF'],
    ['#19416C', '#FFFFFF'],
    ['#006580', '#FFFFFF'],
    ['#93579C', '#FFFFFF'],
    ['#FFFFFF', '#009845']
  ];
  var swatches = $('swatches');
  PRESETS.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button';
    b.style.background = p[0];
    b.style.setProperty('--fg', p[1]);
    b.title = p[0] + ' on ' + p[1];
    b.setAttribute('aria-label', 'Background ' + p[0] + ', foreground ' + p[1]);
    b.addEventListener('click', function () { setColors(p[0], p[1]); });
    swatches.appendChild(b);
  });

  function setColors(bg, fg) {
    state.bg = bg.toUpperCase(); state.fg = fg.toUpperCase();
    $('bg').value = state.bg; $('fg').value = state.fg;
    $('bgHex').textContent = state.bg; $('fgHex').textContent = state.fg;
    render();
  }

  // ---- Text helpers -----------------------------------------------------------------
  function fontStr(weight, size) { return weight + ' ' + size + 'px ' + FONT; }

  function wrap(text, font, maxW) {
    ctx.font = font;
    var words = text.trim().split(/\s+/).filter(Boolean);
    var lines = [], cur = '';
    words.forEach(function (w) {
      var test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width <= maxW || !cur) cur = test;
      else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function widest(lines, font) {
    ctx.font = font;
    return lines.reduce(function (m, l) { return Math.max(m, ctx.measureText(l).width); }, 0);
  }

  // Shrinks the title size until title + subtitle fit the box.
  function fitText(title, subtitle, maxW, maxH, startSize, maxTitleLines) {
    var size = startSize, best = null;
    for (var i = 0; i < 40; i++) {
      var tFont = fontStr(600, size), sSize = Math.round(size * 0.5), sFont = fontStr(400, sSize);
      var tl = title ? wrap(title, tFont, maxW) : [];
      var sl = subtitle ? wrap(subtitle, sFont, maxW) : [];
      var tH = tl.length * size * 1.15;
      var sH = sl.length ? size * 0.3 + sl.length * sSize * 1.3 : 0;
      var h = tH + sH;
      var w = Math.max(widest(tl, tFont), widest(sl, sFont));
      best = { size: size, sSize: sSize, tl: tl, sl: sl, h: h, tH: tH };
      if (tl.length <= maxTitleLines && sl.length <= 2 && h <= maxH && w <= maxW) return best;
      size = Math.max(8, Math.round(size * 0.92));
    }
    return best;
  }

  function drawTextBlock(block, x, y, align) {
    // y is the top of the block; x is left edge (align left) or centre (align center)
    ctx.fillStyle = state.fg;
    ctx.textAlign = align;
    ctx.textBaseline = 'alphabetic';
    var cy = y;
    ctx.font = fontStr(600, block.size);
    block.tl.forEach(function (line) {
      cy += block.size * 1.15;
      ctx.fillText(line, x, cy - block.size * 0.22);
    });
    if (block.sl.length) {
      cy += block.size * 0.3;
      ctx.font = fontStr(400, block.sSize);
      ctx.globalAlpha = 0.8;
      block.sl.forEach(function (line) {
        cy += block.sSize * 1.3;
        ctx.fillText(line, x, cy - block.sSize * 0.3);
      });
      ctx.globalAlpha = 1;
    }
  }

  // ---- Icon helpers -----------------------------------------------------------------
  function toPath(tag, a) {
    var p = new Path2D();
    switch (tag) {
      case 'path': p.addPath(new Path2D(a.d)); break;
      case 'circle': p.arc(+a.cx, +a.cy, +a.r, 0, Math.PI * 2); break;
      case 'ellipse': p.ellipse(+a.cx, +a.cy, +a.rx, +a.ry, 0, 0, Math.PI * 2); break;
      case 'rect': {
        var rx = +(a.rx || a.ry || 0);
        if (rx && typeof p.roundRect === 'function') p.roundRect(+a.x, +a.y, +a.width, +a.height, rx);
        else p.rect(+a.x, +a.y, +a.width, +a.height);
        break;
      }
      case 'line': p.moveTo(+a.x1, +a.y1); p.lineTo(+a.x2, +a.y2); break;
      case 'polyline':
      case 'polygon': {
        var pts = String(a.points).trim().split(/[\s,]+/).map(Number);
        p.moveTo(pts[0], pts[1]);
        for (var i = 2; i < pts.length; i += 2) p.lineTo(pts[i], pts[i + 1]);
        if (tag === 'polygon') p.closePath();
        break;
      }
      default: return null;
    }
    return p;
  }

  function drawIcon(node, x, y, px) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(px / 24, px / 24);
    ctx.lineWidth = state.stroke;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = state.fg;
    ctx.fillStyle = state.fg;
    node.forEach(function (n) {
      var p = toPath(n[0], n[1] || {});
      if (!p) return;
      if (n[1] && n[1].fill && n[1].fill !== 'none') ctx.fill(p);
      ctx.stroke(p);
    });
    ctx.restore();
  }

  function iconSvg(node) {
    var body = node.map(function (n) {
      var attrs = Object.keys(n[1] || {}).map(function (k) { return ' ' + k + '="' + n[1][k] + '"'; }).join('');
      return '<' + n[0] + attrs + '/>';
    }).join('');
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  }

  function kebab(name) {
    return name
      .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
      .replace(/([A-Z])([A-Z][a-z])/g, '$1-$2')
      .replace(/([a-zA-Z])(\d)/g, '$1-$2')
      .toLowerCase();
  }

  // ---- Render -----------------------------------------------------------------------
  function render() {
    var W = state.width, H = Math.round(W * 5 / 8);
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }

    ctx.fillStyle = state.bg;
    ctx.fillRect(0, 0, W, H);

    var pad = W * 0.08;
    var node = ICONS && ICONS[state.icon];
    var hasIcon = state.layout !== 'text' && !!node;
    var title = state.title.trim(), subtitle = state.subtitle.trim();
    var hasText = state.layout !== 'icon' && (title || subtitle);

    if (!hasIcon && !hasText) return;

    if (hasIcon && !hasText) {
      var s = state.iconSize * H * (state.layout === 'icon' ? 1.15 : 1);
      s = Math.min(s, H - 2 * pad * 0.5);
      drawIcon(node, (W - s) / 2, (H - s) / 2, s);
      return;
    }

    if (!hasIcon) {
      var blockT = fitText(title, subtitle, W - 2 * pad, H - 2 * pad * 0.7, H * 0.14, 3);
      drawTextBlock(blockT, W / 2, (H - blockT.h) / 2, 'center');
      return;
    }

    if (state.layout === 'left') {
      var ip = state.iconSize * H;
      var gap = W * 0.05;
      var textX = pad + ip + gap;
      var block = fitText(title, subtitle, W - pad - textX, H - 2 * pad * 0.7, H * 0.135, 3);
      drawIcon(node, pad, (H - ip) / 2, ip);
      drawTextBlock(block, textX, (H - block.h) / 2, 'left');
      return;
    }

    if (state.layout === 'top') {
      var ip2 = state.iconSize * H * 0.85;
      var gap2 = H * 0.06;
      var avail = H - 2 * pad * 0.6 - ip2 - gap2;
      var block2 = fitText(title, subtitle, W - 2 * pad, avail, H * 0.115, 2);
      var total = ip2 + gap2 + block2.h;
      var top = (H - total) / 2;
      drawIcon(node, (W - ip2) / 2, top, ip2);
      drawTextBlock(block2, W / 2, top + ip2 + gap2, 'center');
    }
  }

  // ---- Icon grid --------------------------------------------------------------------
  var grid = $('iconGrid'), status = $('iconStatus');

  function renderGrid(query) {
    if (!ICONS) return;
    var q = (query || '').trim().toLowerCase();
    var qs = q.replace(/[\s_]+/g, '-'), qc = qs.replace(/-/g, '');
    var matches = q ? iconList.filter(function (it) {
      return it.label.indexOf(qs) !== -1 || it.label.replace(/-/g, '').indexOf(qc) !== -1;
    }) : iconList;

    var shown = matches.slice(0, MAX_GRID);
    grid.innerHTML = shown.map(function (it) {
      return '<button type="button" role="option" data-name="' + it.name + '" title="' + it.label + '" aria-label="' + it.label +
        '" aria-pressed="' + (it.name === state.icon) + '">' + iconSvg(ICONS[it.name]) + '</button>';
    }).join('');

    if (!matches.length) status.textContent = 'No icons match "' + query + '".';
    else if (matches.length > MAX_GRID) status.textContent = 'Showing ' + MAX_GRID + ' of ' + matches.length + ' icons. Keep typing to narrow the list.';
    else status.textContent = matches.length + ' of ' + iconList.length + ' icons';
  }

  grid.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-name]');
    if (!b) return;
    state.icon = b.getAttribute('data-name');
    grid.querySelectorAll('button[aria-pressed="true"]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
    b.setAttribute('aria-pressed', 'true');
    render();
  });

  $('iconSearch').addEventListener('input', function (e) { renderGrid(e.target.value); });

  function initIcons() {
    if (ICONS) return;                                   // already initialised
    if (!(window.lucide && window.lucide.icons)) {
      if (window.__lucideFailed) {
        status.textContent = '';
        grid.innerHTML = '<div class="notice">The icon library did not load. Check your internet connection and reload the page. Text-only thumbnails still work.</div>';
        render();
      }
      return;                                            // still loading
    }
    ICONS = window.lucide.icons;
    iconList = Object.keys(ICONS).map(function (n) { return { name: n, label: kebab(n) }; })
      .sort(function (a, b) { return a.label < b.label ? -1 : 1; });
    if (!ICONS[state.icon]) state.icon = iconList[0].name;
    renderGrid('');
    render();
  }
  window.__onLucide = initIcons;
  initIcons();

  // ---- Controls ---------------------------------------------------------------------
  $('title').addEventListener('input', function (e) { state.title = e.target.value; render(); });
  $('subtitle').addEventListener('input', function (e) { state.subtitle = e.target.value; render(); });

  document.querySelectorAll('.layouts button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.layout = b.getAttribute('data-layout');
      document.querySelectorAll('.layouts button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
    });
  });

  $('bg').addEventListener('input', function (e) { setColors(e.target.value, state.fg); });
  $('fg').addEventListener('input', function (e) { setColors(state.bg, e.target.value); });
  $('swap').addEventListener('click', function () { setColors(state.fg, state.bg); });

  $('iconSize').addEventListener('input', function (e) { state.iconSize = +e.target.value / 100; render(); });
  $('stroke').addEventListener('input', function (e) { state.stroke = +e.target.value; render(); });

  $('size').addEventListener('change', function (e) {
    state.width = +e.target.value;
    render();
  });
  $('format').addEventListener('change', function (e) {
    state.format = e.target.value;
    $('download').textContent = 'Download ' + state.format.toUpperCase();
  });

  function slug(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
  }

  $('download').addEventListener('click', function () {
    render();
    var isJpg = state.format === 'jpg';
    var name = (slug(state.title) || 'thumbnail') + '-' + canvas.width + 'x' + canvas.height + (isJpg ? '.jpg' : '.png');
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }, isJpg ? 'image/jpeg' : 'image/png', 0.92);
  });

  // ---- Fonts: redraw once Inter is available so the canvas matches the page ----------
  render();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('600 40px Inter'), document.fonts.load('400 20px Inter')])
      .then(render, function () {});
    document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', render);
  }
})();
</script>
</body>
</html>
